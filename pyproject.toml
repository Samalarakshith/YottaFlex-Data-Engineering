[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yottaflex-pipeline"
version = "0.1.0"
description = "Robust batch data engineering pipeline with schema validation, reject quarantine, and idempotent publishing"
authors = [{ name = "Data Engineering Team" }]
dependencies = [
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "pyyaml>=6.0",
    "tabulate>=0.9.0"
]
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --tb=short"
